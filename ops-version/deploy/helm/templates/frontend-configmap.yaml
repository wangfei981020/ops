apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opsversion.frontend.fullname" . }}-nginx
  labels:
    {{- include "opsversion.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;

      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;

      log_format json escape=json '{"time":"$time_iso8601","status":$status,'
        '"method":"$request_method","uri":"$uri","rt":$request_time,'
        '"ua":"$http_user_agent","xff":"$http_x_forwarded_for"}';
      access_log /dev/stdout json;

      # ★ 转发协议：**上游给了就用上游的**，没给才用自己的 scheme。
      #
      # 直接写 `proxy_set_header X-Forwarded-Proto $scheme` 是错的：
      # 这个 Pod 自己永远是明文 http（TLS 在 Istio Gateway 那层终止），
      # 于是外面明明是 https，传到后端的却是 http，还会**覆盖掉**
      # Envoy 已经设好的正确值。
      # 实测撞到过：OIDC 的 redirect_uri 被拼成 http://...，
      # 和 IdP 里登记的 https:// 对不上，MXID 直接拒绝授权请求
      # （"The requested redirect_uri is missing in the client configuration"）。
      map $http_x_forwarded_proto $fwd_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
      }

      sendfile on;
      tcp_nopush on;
      keepalive_timeout 65;
      server_tokens off;

      gzip on;
      gzip_vary on;
      gzip_min_length 1024;
      gzip_types text/plain text/css application/javascript application/json
                 image/svg+xml application/wasm;

      server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        location = /healthz {
          access_log off;
          add_header Content-Type text/plain;
          return 200 'ok';
        }

        location /assets/ {
          expires 1y;
          add_header Cache-Control "public, immutable";
          try_files $uri =404;
        }

        location = /index.html {
          add_header Cache-Control "no-store, must-revalidate";
        }
        location = /version.json {
          add_header Cache-Control "no-store";
        }

        location /api/ {
          proxy_pass http://{{ include "opsversion.backendAddr" . }};
          proxy_http_version 1.1;
          proxy_set_header Host              $http_host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $fwd_proto;
          proxy_set_header X-Forwarded-Host  $http_host;
          proxy_set_header Connection        "";
          proxy_read_timeout {{ .Values.proxyTimeoutSeconds }}s;
          proxy_send_timeout {{ .Values.proxyTimeoutSeconds }}s;
          proxy_buffering off;
        }

        location / {
          try_files $uri $uri/ /index.html;
        }
      }
    }
