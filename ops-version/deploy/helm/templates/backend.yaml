{{- include "opsversion.requireEnv" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsversion.backend.fullname" . }}
  labels:
    {{- include "opsversion.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "opsversion.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opsversion.backend.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- include "opsversion.antiAffinity" (list . (include "opsversion.backend.selectorLabels" .)) | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "opsversion.image" (dict "ctx" . "img" .Values.backend.image) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
            - name: metrics
              containerPort: {{ .Values.backend.service.metricsPort }}
          {{- with .Values.backend.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # 🔴 preStop 排空：kubelet 先跑它、跑完才发 SIGTERM，
          #    这几秒里 Pod 仍正常服务，正好盖住 Endpoints 摘除传播的时间。
          #    没有它的时候，发布期访问会 504 —— 前端 nginx 还在往一个
          #    已经开始关闭的 backend 发请求，而生产是单副本，没有第二个 Pod 兜底。
          # ⚠️ 与代码里的 drainWait 是**两道**保险，不是重复：
          #    preStop 在 SIGTERM 前、drainWait 在 SIGTERM 后，
          #    而 preStop 在某些路径（如强制删除）下会被跳过。
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          startupProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /ready, port: metrics }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "opsversion.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsversion.backend.fullname" . }}
  labels:
    {{- include "opsversion.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      name: http
    - port: {{ .Values.backend.service.metricsPort }}
      targetPort: metrics
      name: metrics
  selector:
    {{- include "opsversion.backend.selectorLabels" . | nindent 4 }}
{{- $effBackend := ternary (int .Values.backend.autoscaling.minReplicas) (int .Values.backend.replicaCount) .Values.backend.autoscaling.enabled }}
{{- if and .Values.backend.podDisruptionBudget.enabled (gt $effBackend 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "opsversion.backend.fullname" . }}
  labels:
    {{- include "opsversion.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  minAvailable: {{ .Values.backend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "opsversion.backend.selectorLabels" . | nindent 6 }}
{{- end }}
{{- if .Values.backend.autoscaling.enabled }}
{{ include "opsversion.hpa" (dict "ctx" . "name" (include "opsversion.backend.fullname" .) "cfg" .Values.backend.autoscaling "component" "backend") }}
{{- end }}
