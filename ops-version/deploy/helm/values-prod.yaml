requireEnvValues: false

nameOverride: ""
fullnameOverride: ""

global:
  imageRegistry: harbor.example.com/devops

  tag: ""

  imagePullSecrets:
    - name: ops-harbor-login-secret

frontend:
  # 前端是纯静态 nginx，无状态，加副本没有副作用，而它正是用户直接访问的那一层。
  # ⚠️ 目前**按要求保持 1 副本**。单副本下发布期不掉请求靠的是另外两件事：
  #      ① maxSurge:1 / maxUnavailable:0 —— 新 Pod ready 之后才删旧的
  #      ② preStop sleep 5 —— 给 Endpoints 摘除留出传播时间
  #    要开高可用把它改成 2 即可，没有其他前置条件（与 backend 不同，见下）。
  replicaCount: 1

  image:
    repository: ops-version-frontend
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    nodePort: null

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

backend:
  # 🔴🔴 **不要**把这个改成 2。定时采集是每个 Pod 各跑各的 Ticker（main.go），
  #     没有任何选主/租约机制 —— 加副本 = 每轮采集把客户的 Rancher/Kite 打两遍。
  #     我们是去**读**数据的，不该因为自己的高可用给对方加倍压力。
  #     而且这件事**不会报错**：两个 Pod 各采各的，数据也是对的，
  #     只有对方的访问日志里能看出来，我们这边一点异常都没有。
  #
  #     发布期的可用性靠另外三件事保证，已经做了：
  #       ① maxSurge:1 / maxUnavailable:0 —— 新 Pod ready 之后才删旧的
  #       ② preStop sleep 5 —— SIGTERM 之前先排空
  #       ③ 代码里的 drainWait —— 收到 SIGTERM 后先报不就绪、等 10s 再关
  #
  #     要真正做 backend 多副本，前置条件是先给定时采集加选主（见遗留）。
  replicaCount: 1

  image:
    repository: ops-version-backend
    tag: ""
    pullPolicy: IfNotPresent

  service:
    port: 8080
    metricsPort: 8088

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  envFrom:
    - secretRef:
        name: ops-version-backend-secret


metrics:
  enabled: true

  scrapeKind: ServiceMonitor

  labels:
    release: kube-prometheus-stack

  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  relabelings: []

proxyTimeoutSeconds: 120

podAntiAffinity:
  enabled: true
  required: true

nodeSelector: {}
tolerations: []
podAnnotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opsversion.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

istio:
  enabled: true
  annotations: {}

  gateways:
    - istio-system/infra-istio-ingressgateway-inner

  hosts:
    - opsversion.example.com

  matchPrefix:
    - "/"

  timeout: 180s

  retries:
    attempts: 3
    perTryTimeout: 60s
    retryOn: connect-failure,refused-stream
    allowUnsafeRetryOn: false
